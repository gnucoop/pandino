{% extends "admin/base.html" %}

{% block title %}Edit Prompt - Admin Panel{% endblock %}

{% block content %}
<div class="d-flex justify-content-between flex-wrap flex-md-nowrap align-items-center pt-3 pb-2 mb-3 border-bottom">
    <h1 class="h2">Edit Prompt</h1>
</div>

<div class="card">
    <div class="card-body">
        <form method="POST" action="{{ url_for('admin.admin_edit_prompt', prompt_id=prompt.id) }}">
            <div class="mb-3">
                <label for="title" class="form-label">Title</label>
                <input type="text" class="form-control" id="title" name="title" value="{{ prompt.title }}" required>
            </div>
            <div class="mb-3">
                <label for="version" class="form-label">Version</label>
                <input type="number" class="form-control" id="version" name="version" value="{{ prompt.version }}" required>
            </div>
            <div class="mb-3">
                <label for="message" class="form-label">Message</label>
                <textarea class="form-control" id="message" name="message" rows="10" required>{{ prompt.message }}</textarea>
            </div>
            <button type="submit" class="btn btn-primary">Save Changes</button>
            <a href="{{ url_for('admin.admin_prompts') }}" class="btn btn-secondary">Cancel</a>
        </form>
    </div>
</div>
{% endblock %}
