{% extends "admin/base.html" %}

{% block title %}API Docs - Admin Panel{% endblock %}

{% block content %}
<link
  rel="stylesheet"
  href="https://cdnjs.cloudflare.com/ajax/libs/swagger-ui/5.17.14/swagger-ui.min.css"
/>

<div class="d-flex justify-content-between align-items-center mb-3">
  <h2 class="mb-0"><i class="fas fa-book me-2"></i> API Documentation</h2>
</div>
<p class="text-muted">
  Interactive reference for the Pandino HTTP API. The spec is served from
  <code>docs/openapi.yaml</code>.
</p>

<div id="swagger-ui"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/swagger-ui/5.17.14/swagger-ui-bundle.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/swagger-ui/5.17.14/swagger-ui-standalone-preset.min.js"></script>
<script>
  window.addEventListener("load", function () {
    SwaggerUIBundle({
      url: "{{ url_for('admin.admin_openapi_spec') }}",
      dom_id: "#swagger-ui",
      deepLinking: true,
      presets: [
        SwaggerUIBundle.presets.apis,
        SwaggerUIStandalonePreset,
      ],
      layout: "BaseLayout",
    });
  });
</script>
{% endblock %}
