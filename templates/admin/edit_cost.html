{% extends "admin/base.html" %}

{% block title %}Edit Cost - Admin Panel{% endblock %}

{% block content %}
<div class="d-flex justify-content-between flex-wrap flex-md-nowrap align-items-center pt-3 pb-2 mb-3 border-bottom">
    <h1 class="h2">Edit Cost</h1>
</div>

<div class="card">
    <div class="card-body">
        <form method="POST" action="{{ url_for('admin.admin_edit_cost', cost_id=cost.id) }}">
            <div class="row mb-3">
                <div class="col-md-6">
                    <label for="provider" class="form-label">Provider</label>
                    <input type="text" class="form-control" id="provider" name="provider" value="{{ cost.provider }}"
                        required>
                </div>
                <div class="col-md-6">
                    <label for="model" class="form-label">Model</label>
                    <input type="text" class="form-control" id="model" name="model" value="{{ cost.model }}" required>
                </div>
            </div>
            <div class="row mb-3">
                <div class="col-md-6">
                    <label for="token_input_cost" class="form-label">Input Cost (per token)</label>
                    <input type="number" step="0.00000001" class="form-control" id="token_input_cost"
                        name="token_input_cost" value="{{ cost.token_input_cost }}" required>
                </div>
                <div class="col-md-6">
                    <label for="token_output_cost" class="form-label">Output Cost (per token)</label>
                    <input type="number" step="0.00000001" class="form-control" id="token_output_cost"
                        name="token_output_cost" value="{{ cost.token_output_cost }}" required>
                </div>
            </div>
            <div class="row mb-3">
                <div class="col-md-6">
                    <label for="start_date_valid" class="form-label">Start Date</label>
                    <input type="date" class="form-control" id="start_date_valid" name="start_date_valid"
                        value="{{ cost.start_date_valid }}" required>
                </div>
                <div class="col-md-6">
                    <label for="end_date_valid" class="form-label">End Date</label>
                    <input type="date" class="form-control" id="end_date_valid" name="end_date_valid"
                        value="{{ cost.end_date_valid }}" required>
                </div>
            </div>
            <div class="d-flex justify-content-between">
                <a href="{{ url_for('admin.admin_costs') }}" class="btn btn-secondary">Cancel</a>
                <button type="submit" class="btn btn-primary">Save Changes</button>
            </div>
        </form>
    </div>
</div>
{% endblock %}
